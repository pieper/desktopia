<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Desktopia — 3D Slicer</title>
<style>
  body { margin: 0; background: #15151f; color: #d8d8e0;
         font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #v { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #15151f; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 20px; background: #15151f; }
  #overlay.hidden { display: none; }
  #phase { font-size: 26px; font-weight: 600; }
  #log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
         line-height: 1.45; color: #9a9ab0; width: 80vw; max-width: 1100px; height: 46vh;
         overflow-y: auto; white-space: pre-wrap; text-align: left; box-sizing: border-box;
         background: #0e0e16; border: 1px solid #2c2c3a; border-radius: 8px; padding: 12px 14px; }
  #life { width: 132px; height: 132px; image-rendering: pixelated;
          border: 1px solid #2c2c3a; border-radius: 8px; background: #15151f; }
  #sub { font-size: 13px; color: #6cc6ff; margin-top: -8px; min-height: 16px; font-family: ui-monospace, Menlo, monospace; }
  #panes { display: flex; gap: 16px; width: 92vw; max-width: 1500px; }
  .pane { flex: 1 1 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .plabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6a6a82; text-align: left; }
  .plog { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
          line-height: 1.4; color: #9a9ab0; height: 42vh; overflow-y: auto; white-space: pre-wrap;
          text-align: left; box-sizing: border-box; margin: 0; word-break: break-word;
          background: #0e0e16; border: 1px solid #2c2c3a; border-radius: 8px; padding: 10px 12px; }
</style>
</head>
<body>
<canvas id="v" width="1920" height="1080"></canvas>
<div id="overlay">
  <canvas id="life" width="100" height="100"></canvas>
  <div id="phase">Starting…</div>
  <div id="sub"></div>
  <div id="panes">
    <div class="pane"><div class="plabel">image pull · host daemon</div><pre class="plog" id="logD"></pre></div>
    <div class="pane"><div class="plabel">desktop · container</div><pre class="plog" id="logC"></pre></div>
  </div>
</div>
<script>
const HDR = 9; // u32 frame_id, u8 flags, u16 n_chunks, u16 chunk_idx
const ctx = document.getElementById('v').getContext('2d');
const overlay = document.getElementById('overlay');
const phaseEl = document.getElementById('phase');
const subEl = document.getElementById('sub');
const logD = document.getElementById('logD');   // host daemon: docker image pull / provisioning
const logC = document.getElementById('logC');   // container: desktop + stream stdout
const setPane = (el, txt) => {                   // replace text, stick to bottom unless scrolled up
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  if (el.textContent !== (txt || '')) el.textContent = txt || '';
  if (atBottom) el.scrollTop = el.scrollHeight;
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let requestKey = () => {};   // set once the input channel is open; called by the decoder on loss

// ---- "please wait" visual: Conway's Game of Life, reseeded every 10s. A cell is WHITE the
// generation it changes state (just born) and fades toward gray the longer it stays alive. ----
(function life() {
  const cv = document.getElementById('life'); if (!cv) return;
  const W = 100, H = 100, lc = cv.getContext('2d'), img = lc.createImageData(W, H);
  let cur = new Uint8Array(W * H), age = new Uint16Array(W * H);
  const seed = () => { for (let i = 0; i < W * H; i++) { cur[i] = Math.random() < 0.30 ? 1 : 0; age[i] = 0; } };
  function step() {
    const next = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        n += cur[((y + dy + H) % H) * W + ((x + dx + W) % W)];   // toroidal wrap
      }
      const i = y * W + x, a = cur[i], alive = a ? (n === 2 || n === 3) : (n === 3);
      next[i] = alive ? 1 : 0;
      age[i] = alive ? (a ? Math.min(age[i] + 1, 255) : 0) : 0;   // survived -> older; born -> 0 (white)
    }
    cur = next;
  }
  function render() {
    const d = img.data;
    for (let i = 0; i < W * H; i++) {
      const o = i * 4; d[o + 3] = 255;
      if (cur[i]) { const t = Math.min(age[i] / 8, 1);                 // white(255,255,255) -> gray(74,74,90)
        d[o] = 255 + (74 - 255) * t; d[o + 1] = 255 + (74 - 255) * t; d[o + 2] = 255 + (90 - 255) * t; }
      else { d[o] = 0x15; d[o + 1] = 0x15; d[o + 2] = 0x1f; }         // dead = page background
    }
    lc.putImageData(img, 0, 0);
  }
  seed(); render();
  let lastStep = 0, lastSeed = 0;
  function frame(t) {
    if (!overlay.classList.contains('hidden')) {                      // pause once the stream is showing
      if (!lastSeed) lastSeed = t;
      if (t - lastSeed >= 10000) { seed(); lastSeed = t; }
      if (t - lastStep >= 110) { step(); render(); lastStep = t; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// ---- Phase 1: poll the launcher's status.json until the stream is ready, showing boot progress ----
async function poll() {
  let s = null;
  try { const r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) s = await r.json(); }
  catch (e) {}
  if (s) {
    phaseEl.textContent = s.phase || '…';
    subEl.textContent = s.headline || '';
    setPane(logD, s.log_daemon);
    setPane(logC, s.log_container);
    if (s.ready && s.ip_port && s.cert) { connect(s.ip_port, s.cert); return; }
  } else {
    phaseEl.textContent = 'waiting for launcher…';
  }
  setTimeout(poll, 600);
}

// ---- Phase 2: connect the WebTransport / WebCodecs stream; hide the overlay on the first frame ----
function connect(IP_PORT, CERT_B64) {
  phaseEl.textContent = 'Connecting to stream…';
  let firstFrame = false;
  const decoder = new VideoDecoder({
    output: f => { if (!firstFrame) { firstFrame = true; overlay.classList.add('hidden'); }
                   ctx.drawImage(f, 0, 0, 1920, 1080); f.close(); },
    error: e => { console.warn("decode", e); requestKey(); }
  });
  // No `description` => decoder expects Annex-B (matches stream-format=byte-stream)
  decoder.configure({ codec: "avc1.640028", optimizeForLatency: true });

  (async () => {
    const wt = new WebTransport(`https://${IP_PORT}/stream`, {
      serverCertificateHashes: [{ algorithm: "sha-256", value: b64(CERT_B64) }]
    });
    await wt.ready;

    // One reliable client->server stream carries keyframe requests AND input events.
    const inW = (await wt.createUnidirectionalStream()).getWriter();
    const send = a => inW.write(a).catch(e => console.warn("send fail", e));
    function needKey() { send(new Uint8Array([0x00])); }   // type 0 = keyframe request
    requestKey = needKey;
    setupInput(send);

    function setupInput(send) {
      const canvas = document.getElementById('v');
      canvas.tabIndex = 0; canvas.focus();
      const toBitmap = ev => {                    // map CSS coords -> 1920x1080 (object-fit: contain)
        const r = canvas.getBoundingClientRect();
        const s = Math.min(r.width / 1920, r.height / 1080);
        const ox = (r.width - 1920 * s) / 2, oy = (r.height - 1080 * s) / 2;
        const x = Math.max(0, Math.min(1919, Math.round((ev.clientX - r.left - ox) / s)));
        const y = Math.max(0, Math.min(1079, Math.round((ev.clientY - r.top  - oy) / s)));
        return [x, y];
      };
      const move = (x, y) => send(new Uint8Array([1, (x>>8)&255, x&255, (y>>8)&255, y&255]));
      const btn  = b => (b === 0 ? 1 : b === 1 ? 2 : b === 2 ? 3 : 0);   // L/M/R
      let last = 0;
      canvas.addEventListener('pointermove', ev => {
        const t = performance.now(); if (t - last < 16) return; last = t;   // ~60 Hz
        const [x, y] = toBitmap(ev); move(x, y);
      });
      canvas.addEventListener('pointerdown', ev => {
        try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
        canvas.focus(); const [x,y]=toBitmap(ev); move(x,y); send(new Uint8Array([2, btn(ev.button)]));
      });
      canvas.addEventListener('pointerup', ev => {
        send(new Uint8Array([3, btn(ev.button)]));
        try { canvas.releasePointerCapture(ev.pointerId); } catch (_) {}
      });
      canvas.addEventListener('contextmenu', ev => ev.preventDefault());
      canvas.addEventListener('wheel', ev => { ev.preventDefault(); send(new Uint8Array([4, ev.deltaY < 0 ? 0 : 1])); }, { passive: false });
      const KS = { Enter:0xFF0D, Backspace:0xFF08, Tab:0xFF09, Escape:0xFF1B, Delete:0xFFFF,
        ArrowLeft:0xFF51, ArrowUp:0xFF52, ArrowRight:0xFF53, ArrowDown:0xFF54,
        Home:0xFF50, End:0xFF57, PageUp:0xFF55, PageDown:0xFF56, Insert:0xFF63,
        Shift:0xFFE1, Control:0xFFE3, Alt:0xFFE9, Meta:0xFFE7, CapsLock:0xFFE5, ' ':0x20 };
      const keysym = ev => {
        if (ev.key in KS) return KS[ev.key];
        if (ev.key.length === 1) return ev.key.charCodeAt(0);
        const m = /^F(\d+)$/.exec(ev.key); return m ? 0xFFBE + (+m[1] - 1) : 0;
      };
      window.addEventListener('keydown', ev => { const k = keysym(ev); if (k) { ev.preventDefault(); send(new Uint8Array([5, (k>>8)&255, k&255])); } });
      window.addEventListener('keyup',   ev => { const k = keysym(ev); if (k) { ev.preventDefault(); send(new Uint8Array([6, (k>>8)&255, k&255])); } });
    }

    const partial = new Map();           // frame_id -> {parts:[], have, n, key}
    let ts = 0, haveKey = false, lastDone = -1;

    function onDatagram(buf) {
      const dv = new DataView(buf.buffer, buf.byteOffset);
      const fid = dv.getUint32(0), flags = dv.getUint8(4);
      const n = dv.getUint16(5), idx = dv.getUint16(7);
      const isKey = (flags & 1) === 1;
      const body = new Uint8Array(buf.buffer, buf.byteOffset + HDR);
      if (fid <= lastDone) return;                       // drop late chunks for a passed frame
      let f = partial.get(fid);
      if (!f) { f = { parts: new Array(n), have: 0, n, key: isKey }; partial.set(fid, f); }
      if (!f.parts[idx]) { f.parts[idx] = body; f.have++; }
      if (f.have === f.n) decodeFrame(fid, f);
      for (const [oid, of] of partial) {                 // loss: a later frame completed first
        if (oid < fid && of.have < of.n) { partial.delete(oid); if (!of.key) haveKey && needKey(); }
      }
    }
    function decodeFrame(fid, f) {
      partial.delete(fid); lastDone = fid;
      if (!haveKey && !f.key) { needKey(); return; }     // wait for an entry point
      if (f.key) haveKey = true;
      const data = new Uint8Array(f.parts.reduce((a, p) => a + p.length, 0));
      let o = 0; for (const p of f.parts) { data.set(p, o); o += p.length; }
      decoder.decode(new EncodedVideoChunk({ type: f.key ? "key" : "delta", timestamp: ts, data }));
      ts += 1e6 / 60;
    }

    const reader = wt.datagrams.readable.getReader();
    while (true) { const { value, done } = await reader.read(); if (done) break; onDatagram(value); }
  })().catch(e => { phaseEl.textContent = 'connection failed — retrying…'; logEl.textContent = String(e);
                    overlay.classList.remove('hidden'); setTimeout(poll, 1500); });
}

poll();
</script>
</body>
</html>
