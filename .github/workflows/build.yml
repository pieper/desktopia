name: build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint-wayland.sh"
      - "session-wayland.sh"
      - "provision-wayland.sh"
      - "wl-fixwayland.sh"
      - "server.py"
      - "client/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/desktopia

jobs:
  build:
    runs-on: ubuntu-latest          # amd64 — matches vast.ai GPU hosts
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The vast base (vastai/linux-desktop, ~6 GB compressed / ~15 GB unpacked) + the builder
      # stage overflow the runner's default ~14 GB free disk. Reclaim ~25 GB of preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/lib/jvm || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
