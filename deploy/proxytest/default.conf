map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  client_max_body_size 0;
  location = /offload-ws { proxy_pass http://host.docker.internal:2028; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 3600s; }
  location /offload/ { proxy_pass http://host.docker.internal:2027/; }
  location / { proxy_pass http://host.docker.internal:4434; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 3600s; }
}
