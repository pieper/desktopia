# Desktopia on NRP/Nautilus @ MGHPCC (namespace slicer-dev, NVIDIA A10) — TEST mode.
# Uses a STOCK ubuntu:24.04 image (no custom build yet); we push the repo in with tar|kubectl exec,
# and entrypoint-wayland.sh installs deps + fetches the compositor/Slicer + launches at runtime.
# Streams over WebSocket through NRP's HTTPS ingress (no public UDP needed).
#
#   kubectl apply -f deploy/nrp-desktopia.yaml
#   kubectl get pod desktopia -n slicer-dev -w                       # wait for Running
#   tar czf - --exclude=.git --exclude=.venv --exclude=__pycache__ . \
#     | kubectl exec -i -n slicer-dev desktopia -- bash -c 'mkdir -p /opt/desktopia && tar xzf - -C /opt/desktopia'
#   kubectl logs -f desktopia -n slicer-dev
#   open https://desktopia-slicer-dev.nrp-nautilus.io/
apiVersion: v1
kind: Pod
metadata:
  name: desktopia
  namespace: slicer-dev
  labels: { app: desktopia }
spec:
  nodeSelector:
    topology.kubernetes.io/zone: mghpcc          # MGHPCC (gpu-01..18); region us-east
    nvidia.com/gpu.product: NVIDIA-A10
  containers:
    - name: desktopia
      image: ubuntu:24.04                         # generic; we install + run our stack at runtime (no custom image)
      # wait for the pushed code, then run the stack (the GPU gets used as soon as Slicer renders)
      command: ["bash","-lc","until [ -f /opt/desktopia/entrypoint-wayland.sh ]; do echo 'waiting for code (tar|kubectl exec)…'; sleep 2; done; cd /opt/desktopia && exec bash entrypoint-wayland.sh"]
      env:
        - { name: NVIDIA_DRIVER_CAPABILITIES, value: "all" }  # CRITICAL: graphics/display caps for EGL/GL + NVENC
        - { name: DESKTOPIA_WS_PLAIN,  value: "1" }           # ingress terminates TLS; serve plain ws
        - { name: DESKTOPIA_HTTP_PORT, value: "8080" }        # pod serves the client page here
      ports:
        - { containerPort: 8080 }                  # client page (index.html + status.json)
        - { containerPort: 4434 }                  # websocket video/input/control
      resources:
        limits:   { nvidia.com/gpu: "1", cpu: "8", memory: "16Gi", ephemeral-storage: "24Gi" }
        requests: { nvidia.com/gpu: "1", cpu: "4", memory: "8Gi",  ephemeral-storage: "24Gi" }
      # If the compositor logs `Supported DMA formats: []`, the GPU render node isn't visible; add a
      # render-node device mount (and if Pod Security Admission blocks it, ask NRP admins on Matrix):
      #   volumeMounts: [{ name: dri, mountPath: /dev/dri }]
  # volumes: [{ name: dri, hostPath: { path: /dev/dri } }]
---
apiVersion: v1
kind: Service
metadata: { name: desktopia, namespace: slicer-dev }
spec:
  selector: { app: desktopia }
  ports:
    - { name: page, port: 8080, targetPort: 8080 }
    - { name: ws,   port: 4434, targetPort: 4434 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desktopia
  namespace: slicer-dev
spec:
  ingressClassName: haproxy
  rules:
    - host: desktopia-slicer-dev.nrp-nautilus.io
      http:
        paths:
          - { path: /ws, pathType: Prefix, backend: { service: { name: desktopia, port: { number: 4434 } } } }
          - { path: /,   pathType: Prefix, backend: { service: { name: desktopia, port: { number: 8080 } } } }
  tls:
    - hosts: [ desktopia-slicer-dev.nrp-nautilus.io ]   # NRP auto-provisions the Let's Encrypt cert
